# Debian 13 (Trixie) 基础镜像配置
name: debian13
description: Debian 13 (Trixie) 基础镜像
version: "1.0.0"

source:
  amd64: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
  arm64: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2

disk:
  size: 10G

settings:
  timezone: Asia/Shanghai
  locale: en_US.UTF-8
  hostname: debian

apt:
  mirror: https://mirrors.tuna.tsinghua.edu.cn/debian
  security: https://mirrors.tuna.tsinghua.edu.cn/debian-security

packages:
  - vim
  - curl
  - wget
  - git
  - htop
  - tmux
  - net-tools
  - ca-certificates
  - gnupg
  - qemu-guest-agent
  - cloud-guest-utils
  - socat
  - jq
  - tree
  - bash-completion
  - lsof
  - netcat-openbsd
  - ethtool
  - iptables

commands:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - update-alternatives --set editor /usr/bin/vim.basic
